name: CI

# Runs on every push and PR to main. The deploy job only runs on a push to main
# AND only if the test job passes — so broken code can't reach live pilots.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # The offline tests take under a minute; a hang must fail fast, not run
    # for 14 minutes as on 2026-11-20 (see conftest.py).
    timeout-minutes: 10
    # Dummy creds so modules import without secrets. The offline tests do NO
    # network I/O — clients are built lazily, nothing connects at import.
    env:
      OPENAI_API_KEY: test
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_KEY: test
      TELEGRAM_BOT_TOKEN: test
      QUERY_LOG_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Match Render's runtime so version-specific bugs surface here, not live.
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Compile all modules (syntax)
        run: python -m compileall -q .

      - name: Import entry points (catches import/wiring errors)
        # This step alone would have caught several of our past breakages.
        run: |
          python -c "import main"
          PYTHONPATH=checks python -c "import e2e"
          PYTHONPATH=checks python -c "import harness"

      - name: Offline unit tests (every test file, as run_all_checks.sh does)
        # All test_*.py, not only test_offline.py: the disambiguation, scope,
        # approach-routing and charges tests guard live behaviour too.
        # --timeout: a test stuck for 2 minutes fails and prints where it was
        # stuck, instead of the whole job silently using up its time.
        # --durations: the 10 slowest tests are listed at the end.
        run: pytest -q --timeout=120 --durations=10

      - name: Known-vulnerability scan of the pinned dependencies
        # Blocks the deploy if a pinned package has a published vulnerability.
        # Fix: raise the version in requirements.in, run pin_requirements.sh.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off

  deploy:
    # Gate: only after tests pass, only on a real push to main.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        # Requires repo secret RENDER_DEPLOY_HOOK (Render → service → Settings →
        # Deploy Hook). Render auto-deploy MUST be turned OFF, or it will deploy
        # on push regardless of this gate.
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
